<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vidhya Security Force - Field Operations Portal</title>

  <!-- Force light color scheme to prevent Android dark mode auto-inversion -->
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">

  <!-- VSF Crimson Red Theme Color -->
  <meta name="theme-color" content="#B91C1C">

  <!-- Mobile PWA Support -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VSF Field Ops">
  <link rel="apple-touch-icon" href="/pwa-192x192.png">

  <!-- PWA Web App Manifest -->
  <link rel="manifest" href="/manifest.json">

  <!-- Fonts & Styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #FBFBF9;
      color: #0f172a;
      -webkit-tap-highlight-color: transparent;
    }

    /* Native Inputs & Datepicker Contrast Fix */
    input[type="date"],
    input[type="datetime-local"],
    input[type="time"] {
      color-scheme: light !important;
      color: #0f172a !important;
      background-color: #ffffff !important;
    }

    ::-webkit-calendar-picker-indicator {
      filter: invert(0) !important;
      cursor: pointer;
    }

    ::-webkit-datetime-edit-fields-wrapper,
    ::-webkit-datetime-edit-text,
    ::-webkit-datetime-edit-month-field,
    ::-webkit-datetime-edit-day-field,
    ::-webkit-datetime-edit-year-field {
      color: #0f172a !important;
    }

    /* Fix Android Capacitor WebView Native Select Dropdown Legibility */
    select option {
      background-color: #ffffff !important;
      color: #0f172a !important;
      font-weight: 600 !important;
      padding: 10px !important;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0",
      "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
      "recharts": "https://esm.sh/recharts@^3.6.0",
      "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.48.1",
      "react/": "https://esm.sh/react@^19.2.3/",
      "react": "https://esm.sh/react@^19.2.3",
      "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
    }
  }
  </script>
  <link rel="stylesheet" href="/index.css">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((reg) => console.log('VSF SW Registered!', reg.scope))
          .catch((err) => console.error('VSF SW Registration Failed!', err));
      });
    }
  </script>
</body>
</html>
